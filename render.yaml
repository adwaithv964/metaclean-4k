services:
  - type: web
    name: metaclean-4k
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: MAX_UPLOAD_BYTES
        value: 104857600
      - key: MAX_PIXELS
        value: 100000000
      - key: MAX_PROCESS_MS
        value: 30000
      - key: TEMP_RETENTION_MS
        value: 300000
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 30
